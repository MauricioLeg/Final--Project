<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="author" content="Mauricio Leguizamon">
    <meta name="description" content="A website to grow your wisdom! Learn how to discern between good and bad content from any type of content. From Instagram post to CNN news!">
    <link rel="icon" href="images/debunked.svg">
    <title>Debunked - Homepage</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/main.mjs" type="module"></script>
</head>
<body>
    <header>
        <nav class="navBar">
            <section class="siteLinks">
                <img src="images/debunked.svg" alt="Debunked icon" width=" 40px" height="40px">
                <a href="https://mauricioleg.github.io/Final--Project/" data-i18n="nav_homepage">Homepage</a>
                <a href="https://mauricioleg.github.io/Final--Project/about-us.html" data-i18n="nav_about">About Us</a>
            </section>
            <section class="log-lang">
                <select id="language-selector">
                    🌐
                    <option value="en">English</option>
                    <option value="es-419">Español (Latam)</option>
                    <option value="es-ES">Español (España)</option>
                    <option value="pt-BR">Português</option>
                    <option value="ja">日本語</option>
                    <option value="ko">한국어</option>
                </select>
                <div id="auth-nav-container">
                    <a href="#" id="nav-login" data-i18n="nav_login">Log In</a>
                    <a href="#" id="nav-register" data-i18n="nav_register">Register</a>
                </div>
            </section>
        </nav>
    </header>

    <main>
        <div class="games">

        </div>

        <div class="news">

        </div>

    </main>
    
    <footer>
        <div class="container">
            <a href="https://github.com/MauricioLeg" target="_blank"><img src="images/github.svg" alt="Link to personal GitHub page" class="round"></a>
            <a href="https://www.linkedin.com/in/mauricio-leguizamon-2504292a5/" target="_blank"><img src="images/linkedin.svg" alt="Link to personal LinkedIn page" class="square"></a>
            <a href="https://www.facebook.com/mauricio.leguizamon.731" target="_blank"><img src="images/facebook.svg" alt="Link to personal Facebook page" class="round"></a>
            <a href="https://www.instagram.com/leguizamon2337/" target="_blank"><img src="images/instagram.svg" alt="Link to personal Instagram page" class="square"></a>
        </div>
        <div class="info">
            <p>© <span id="currentyear"></span> ※ Mauricio Leguizamon ※ Tucuman, Argentina</p>
            <p id="lastModified"></p>
        </div>
    </footer>
    <button id="contact-btn" title="Contact Us">💬</button>

    <div id="contact-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <button id="close-btn" class="close-btn">&times;</button>
            <h2 data-i18n="contact-title">Get in Touch</h2>
            <form id="contact-form" novalidate>
                <div class="form-group">
                    <label for="email" data-i18n="contact-label-email">Email</label>
                    <input type="email" id="email" required placeholder="your.email@example.com">
                </div>
                <div class="form-group">
                    <label for="message-type" data-i18n="contact-label-purpose">Purpose</label>
                    <select id="message-type">
                        <option value="feedback" data-i18n="contact-feedback">General Feedback</option>
                        <option value="bug" data-i18n="contact-bug">Report a Bug</option>
                        <option value="suggestion" data-i18n="contact-suggestion">Suggest a Headline</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="message" data-i18n="contact-message">Message</label>
                    <textarea id="message" rows="4" required placeholder="Write your message here"></textarea>
                </div>
                    <button type="submit" class="submit-btn" data-i18n="contact-btn-submit">Send Message</button>
            </form>
            <div id="form-feedback" class="hidden"></div>
        </div>
    </div>
    <div id="auth-modal" class="modal-overlay hidden">
        <div class="modal-card">
            <button id="auth-close-btn" class="close-btn">&times;</button>
            <h2 id="auth-title">Register</h2>

            <form id="auth-form" novalidate>
                <div class="form-group">
                    <label for="auth-username">Username</label>
                    <input type="text" id="auth-username" required placeholder="Choose a username">
                </div>
                
                <div class="form-group" id="auth-age-group">
                    <label for="auth-age">Age</label>
                    <input type="number" id="auth-age" required placeholder="Your age" min="13">
                </div>

                <div class="form-group">
                    <label for="auth-password">Password</label>
                    <input type="password" id="auth-password" required placeholder="Enter password" autocomplete="current-password">
                </div>

                <button type="submit" class="submit-btn" id="auth-submit-btn">Create Account</button>
            </form>
            
            <p class="auth-toggle-container">
                <a href="#" id="auth-toggle-link">Already have an account? Log in here</a>
            </p>

            <div id="auth-feedback" class="auth-feedback hidden"></div>
        </div>
    </div>
</body>
</html>
